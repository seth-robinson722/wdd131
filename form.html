<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html" class="review-form">
            <label for="product-name">Product Name</label>
            <select id="product-name" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset class="rating-box">
                <legend>Overall Rating</legend>
                <div class="stars">
                    <label><input type="radio" name="rating" value="1" required> 1 ☆</label>
                    <label><input type="radio" name="rating" value="2"> 2 ☆</label>
                    <label><input type="radio" name="rating" value="3"> 3 ☆</label>
                    <label><input type="radio" name="rating" value="4"> 4 ☆</label>
                    <label><input type="radio" name="rating" value="5"> 5 ☆</label>
                </div>
            </fieldset>

            <label for="install-date">Date of Installation</label>
            <input type="date" id="install-date" name="installDate" required>

            <fieldset>
                <legend>Which features did you find useful? (Check all that apply)</legend>
                <label><input type="checkbox" name="features" value="durability"> Durability</label>
                <label><input type="checkbox" name="features" value="ease-of-use"> Ease of Use</label>
                <label><input type="checkbox" name="features" value="design"> Design</label>
            </fieldset>

            <label for="written-review">Written Review (Optional)</label>
            <textarea id="written-review" name="writtenReview" rows="4"></textarea>

            <label for="user-name">Your Name (Optional)</label>
            <input type="text" id="user-name" name="userName">

            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy; <span id="year"></span> | Product Review Assignment | Your Name</p>
    </footer>
</body>

</html>
