<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Seth Robinson">
    <meta name="description"
        content="Share your experience! Use our easy review form to rate your favorite flux capacitors and time circuits. Your feedback helps our community find the best gear.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html" class="review-form">
            <label for="product-name">Product Name</label>
            <select id="product-name" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset class="rating-box">
                <legend>Overall Rating</legend>
                <div class="stars">
                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1">1 ☆</label>

                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2">2 ☆</label>

                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3">3 ☆</label>

                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4">4 ☆</label>

                    <input type="radio" id="star5" name="rating" value="5">
                    <label for="star5">5 ☆</label>
                </div>
            </fieldset>

            <label for="install-date">Date of Installation</label>
            <input type="date" id="install-date" name="installDate" required>

            <fieldset>
                <legend>Which features did you find useful? (Check all that apply)</legend>
                <input type="checkbox" id="feat-durability" name="features" value="durability">
                <label for="feat-durability">Durability</label>

                <input type="checkbox" id="feat-ease" name="features" value="ease-of-use">
                <label for="feat-ease">Ease of Use</label>

                <input type="checkbox" id="feat-design" name="features" value="design">
                <label for="feat-design">Design</label>

                <input type="checkbox" id="feat-efficiency" name="features" value="efficiency">
                <label for="feat-efficiency">Efficiency</label>
            </fieldset>

            <label for="written-review">Written Review (Optional)</label>
            <textarea id="written-review" name="writtenReview" rows="4"></textarea>

            <label for="user-name">Your Name (Optional)</label>
            <input type="text" id="user-name" name="userName">

            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy; <span id="year"></span> | Product Review Assignment | Seth Robinson</p>
    </footer>
</body>

</html>
